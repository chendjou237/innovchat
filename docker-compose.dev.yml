name: innovcare-dev
# Local infrastructure only. Run the api, worker and web with pnpm (see README).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: innovcare
      POSTGRES_PASSWORD: innovcare
      POSTGRES_DB: innovcare
    ports: ["5433:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: [redisdata-dev:/data]
volumes:
  pgdata-dev:
  redisdata-dev:
