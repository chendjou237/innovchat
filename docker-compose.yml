name: innovcare
# Production stack for a single VPS. Copy .env.example to .env, fill it in, then:
#   docker compose up -d --build
services:
  caddy:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on: [api]

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment: &app-env
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://innovcare:${POSTGRES_PASSWORD}@postgres:5432/innovcare
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: https://${DOMAIN}
      TZ: Africa/Douala
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment: *app-env
    command: ["node", "dist/worker.js"]
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: innovcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: innovcare
      TZ: Africa/Douala
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innovcare"]
      interval: 5s
      retries: 10

  # AOF persistence: queued, retrying and scheduled jobs survive a restart (NFR-07).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redisdata:/data]

  backup:
    build: { context: ., dockerfile: docker/backup.Dockerfile }
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: innovcare
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: innovcare
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
      TZ: Africa/Douala
    volumes: [./backups:/backups]
    depends_on: [postgres]

volumes:
  pgdata:
  redisdata:
  caddy-data:
  caddy-config:
